<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego de Rol - Login</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    fieldset { margin-bottom: 20px; padding: 16px; border: 1px solid #ccc; border-radius: 6px; }
    label { display: block; margin-bottom: 8px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { padding: 8px 16px; margin-top: 12px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 4px; overflow-x: auto; }
    .status { padding: 8px; margin-top: 8px; border-radius: 4px; }
    .ok { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>🎮 Juego de Rol</h1>

  <fieldset>
    <legend>Login</legend>
    <label>Correo: <input type="email" id="correo" value="admin@juego.com"></label>
    <label>Contraseña: <input type="password" id="contrasena" value="admin123"></label>
    <button onclick="login()">Iniciar sesión</button>
    <button onclick="logout()">Cerrar sesión</button>
    <div id="loginStatus"></div>
  </fieldset>

  <fieldset>
    <legend>Recursos protegidos</legend>
    <button onclick="loadMe()">GET /api/me</button>
    <button onclick="loadPersonajes()">GET /api/personajes</button>
    <button onclick="loadUsuarios()">GET /api/usuarios/1/personajes (solo ADMIN)</button>
    <pre id="output">— Inicia sesión y prueba los endpoints —</pre>
  </fieldset>

  <script src="login.js"></script>
</body>
</html>
